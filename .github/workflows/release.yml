name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-executable:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build executable
      run: |
        python build/build-executable.py

    - name: Build zip archive
      shell: pwsh
      run: |
        Compress-Archive -Path launcher\WindowsToolkit.exe -DestinationPath launcher\WindowsToolkit.zip -Force

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: toolkit-executable
        path: |
          launcher/WindowsToolkit.exe
          launcher/WindowsToolkit.zip

  create-release:
    needs: [build-executable]
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          toolkit-executable/WindowsToolkit.exe
          toolkit-executable/WindowsToolkit.zip
        body: |
          ## Changes
          - Standalone executable built from the current Textual interface
          - ZIP archive for the one-line PowerShell launcher
          - PowerShell launcher script downloads WindowsToolkit.zip

          ## Installation
          See [INSTALLATION.md](docs/INSTALLATION.md) for details.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
